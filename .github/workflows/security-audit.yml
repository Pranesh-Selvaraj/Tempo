name: Dependency Audit

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Audit dependencies
        run: pnpm audit --audit-level high
