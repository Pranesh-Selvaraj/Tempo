<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Clockwise rotation</title>
  <desc id="desc">The six court positions with arrows showing the clockwise rotation 2 to 1, 1 to 6, 6 to 5, 5 to 4, 4 to 3, 3 to 2.</desc>
  <style>
    .court { fill: rgba(148,163,184,0.07); stroke: #cbd5e1; stroke-width: 2; }
    .net { stroke: #f8fafc; stroke-width: 4; }
    .dash { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 8 6; }
    .zone { fill: rgba(34,197,94,0.12); stroke: #4ade80; stroke-width: 2; }
    .num { fill: #e2e8f0; font: 700 24px ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
    .label { fill: #94a3b8; font: 600 13px ui-sans-serif, system-ui, sans-serif; }
    .caption { fill: #cbd5e1; font: 500 13px ui-sans-serif, system-ui, sans-serif; }
    .step { fill: #4ade80; font: 500 11px ui-sans-serif, system-ui, sans-serif; }
    .arc { fill: none; stroke: #4ade80; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80" />
    </marker>
  </defs>

  <line class="net" x1="185" y1="90" x2="535" y2="90" />
  <text class="label" x="545" y="95">Net</text>
  <rect class="court" x="210" y="90" width="300" height="250" rx="3" />
  <line class="dash" x1="210" y1="173" x2="510" y2="173" />

  <path class="arc" d="M 470 162 Q 530 192 470 222" />
  <path class="arc" d="M 436 247 L 384 247" />
  <path class="arc" d="M 336 247 L 284 247" />
  <path class="arc" d="M 250 222 L 250 162" />
  <path class="arc" d="M 284 135 L 336 135" />
  <path class="arc" d="M 384 135 L 436 135" />

  <circle class="zone" cx="260" cy="135" r="24" />
  <text class="num" x="260" y="144">4</text>
  <circle class="zone" cx="360" cy="135" r="24" />
  <text class="num" x="360" y="144">3</text>
  <circle class="zone" cx="460" cy="135" r="24" />
  <text class="num" x="460" y="144">2</text>
  <circle class="zone" cx="260" cy="247" r="24" />
  <text class="num" x="260" y="256">5</text>
  <circle class="zone" cx="360" cy="247" r="24" />
  <text class="num" x="360" y="256">6</text>
  <circle class="zone" cx="460" cy="247" r="24" />
  <text class="num" x="460" y="256">1</text>

  <text class="step" x="522" y="197">2 → 1</text>
  <text class="step" x="410" y="240" text-anchor="middle">1 → 6</text>
  <text class="step" x="310" y="240" text-anchor="middle">6 → 5</text>
  <text class="step" x="238" y="197" text-anchor="end">5 → 4</text>
  <text class="step" x="360" y="127" text-anchor="middle">4 → 3 · 3 → 2</text>

  <text class="caption" x="360" y="378" text-anchor="middle">Winning the serve back rotates every player one position clockwise before serving.</text>
</svg>
